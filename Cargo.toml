[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neilmanfredit/hat_timelapse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
quick-xml = "0.37"
rayon = "1"
hat_timelapse_core = { path = "crates/hat_timelapse_core" }
hat_timelapse_xmp = { path = "crates/hat_timelapse_xmp" }
hat_timelapse_render = { path = "crates/hat_timelapse_render" }

[profile.release]
lto = "thin"
