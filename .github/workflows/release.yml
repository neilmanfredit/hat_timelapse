name: Release

# Three ways to make a release; each builds every platform and attaches the
# downloads:
#   - Actions → Release → Run workflow, and enter a version such as v0.1.0
#   - Releases → Draft a new release, with a new tag such as v0.1.0
#   - push a tag such as v0.1.0
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0"
        required: true
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

# Publishing a release can also report its tag being created; build once per tag.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: windows-latest
            target: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          mkdir -p out
          if [ "${{ matrix.target }}" = "macos-universal" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p hat_timelapse_cli -p hat_timelapse_gui --target $t
            done
            for b in hat_timelapse hat_timelapse_app; do
              lipo -create -output out/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
            done
          else
            cargo build --release --locked -p hat_timelapse_cli -p hat_timelapse_gui
            for b in hat_timelapse hat_timelapse_app; do
              cp target/release/$b out/ 2>/dev/null || cp target/release/$b.exe out/
            done
          fi
          ls -l out

      - name: Smoke test
        run: |
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then ./out/hat_timelapse.exe --version; else ./out/hat_timelapse --version; fi

      - name: Package
        run: |
          name="hat_timelapse-${TAG}-${{ matrix.target }}"
          mkdir -p "pkg/$name" dist
          cp README.md LICENSE-MIT LICENSE-APACHE docs/INSTALL.md docs/USER_GUIDE.md "pkg/$name/"
          case "${{ matrix.target }}" in
            macos-universal)
              app="pkg/Hat Timelapse.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp out/hat_timelapse out/hat_timelapse_app "$app/Contents/MacOS/"
              sed "s/@VERSION@/${TAG#[vV]}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              mkdir icon.iconset
              for s in 16 32 128 256 512; do
                sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
                sips -z $((s*2)) $((s*2)) assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
              done
              iconutil -c icns icon.iconset -o "$app/Contents/Resources/HatTimelapse.icns"
              codesign --force --deep --sign - "$app"
              # Archive for the installer: the app plus the command-line engine.
              cp -R "$app" "pkg/$name/"
              cp out/hat_timelapse "pkg/$name/"
              tar -czf "dist/$name.tar.gz" -C pkg "$name"
              # Disk image for installing by hand: drag the app to Applications.
              mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
              cp docs/INSTALL.md dmg/
              hdiutil create -volname "Hat Timelapse" -srcfolder dmg -ov -format UDZO "dist/HatTimelapse-${TAG}-macos.dmg"
              ;;
            windows-x86_64)
              cp out/hat_timelapse.exe out/hat_timelapse_app.exe "pkg/$name/"
              (cd pkg && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
              ;;
            *)
              cp out/hat_timelapse out/hat_timelapse_app "pkg/$name/"
              cp packaging/linux/hat-timelapse.desktop "pkg/$name/"
              cp assets/icon-256.png "pkg/$name/hat-timelapse.png"
              tar -czf "dist/$name.tar.gz" -C pkg "$name"
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hat Timelapse ${{ env.TAG }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
